# Pages CMS (https://pagescms.org) configuration: a web editor for the blog.
# New posts start hidden (Published off). Turning Published on makes them appear on the site with their original date.
media:
  input: assets/img/blog
  output: /assets/img/blog

content:
  - name: posts
    label: Blog posts
    type: collection
    path: _posts
    format: yaml-frontmatter
    filename: "{year}-{month}-{day}-{title}.md"
    view:
      fields: [title, date, published]
      primary: title
      default:
        sort: date
        order: desc
    fields:
      - name: published
        label: Published (visible on the site)
        type: boolean
        default: false
      - name: layout
        type: string
        default: post
        hidden: true
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: description
        label: One-line description (shown in the blog list)
        type: string
      - name: body
        label: Body
        type: rich-text
        options:
          format: markdown
