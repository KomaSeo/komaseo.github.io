cv:
  name: Youngseok Seo
  label: HCI Researcher
  email: ysseo0910@gmail.com
  location: Daejeon, Republic of Korea
  image: ""
  summary: >-
    I'm working on positive computing and digital wellbeing, asking how people can retain agency over digital media and AI that shape their
    behavior and cognition. My current focus is helping people (1) examine how their digital and AI use affects them, (2) share these effects
    with the people around them, and (3) recommend harm prevention tools that fit their situation.

